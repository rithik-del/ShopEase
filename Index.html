
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>🛍️ ShopEase</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
        <span>🛒 Cart: <b id="cartCount">0</b></span>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Welcome to ShopEase</h1>
    <p>Find Your Favourite Products at Best Prices</p>
    <a href="#products" class="btn">Shop Now</a>
</section>

<section id="products">
    <h2>Our Products</h2>

    <input type="text" id="search"
    placeholder="Search products..." onkeyup="searchProducts()">

    <div class="product-container">

        <div class="product">
            <div class="emoji">🎧</div>
            <h3>Headphones</h3>
            <p>₹999</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <div class="emoji">⌚</div>
            <h3>Smart Watch</h3>
            <p>₹1499</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <div class="emoji">🎒</div>
            <h3>Backpack</h3>
            <p>₹799</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <div class="emoji">👟</div>
            <h3>Shoes</h3>
            <p>₹1299</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

    </div>
</section>

<section id="contact">
    <h2>Contact Us</h2>
    <p>Email: support@shopease.example</p>
</section>

<footer>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
